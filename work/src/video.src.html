<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Neutrinos Letais</title>
<style>
@font-face{font-family:'Fredoka';src:url(data:font/woff2;base64,__FONT__) format('woff2');font-weight:300 700;font-display:block}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
#gl{display:none}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<canvas id="gl" width="16" height="16"></canvas>
<script>
'use strict';
// =====================================================================
//  NEUTRINOS LETAIS. Cada frame é função pura do tempo: window.seek(t)
// =====================================================================
const W = 1920, H = 1080, FPS = 30;
const WORDS = __WORDS__;
const DUR = 62.5;

// ---------- utilidades ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const easeIO = u => (u = clamp(u), u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const easeOutQuint = u => 1 - Math.pow(1 - clamp(u), 5);
const easeOutCubic = u => 1 - Math.pow(1 - clamp(u), 3);
const easeInCubic = u => clamp(u) ** 3;
const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const ramp = (t, t0, d) => clamp((t - t0) / d);
// mola amortecida (damping .45, freq 14): 0 -> 1 com overshoot
function spring(dt, z = .45, w = 14) {
  if (dt <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + (z * w / wd) * Math.sin(wd * dt));
}
// impulso amortecido (0 -> pico -> 0), para squash & stretch e tremidas
function kick(dt, z = .42, w = 16) {
  if (dt <= 0) return 0;
  return Math.exp(-z * w * dt) * Math.sin(w * Math.sqrt(1 - z * z) * dt);
}
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
const fmtInt = n => Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
function fmtDec(x, d) { return x.toFixed(d).replace('.', ','); }

// ---------- palavras e deixas ----------
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
function cue(w, n = 1) {
  let k = 0;
  for (const x of WORDS) if (norm(x.w) === norm(w) && ++k === n) return x.t0;
  throw new Error('cue ' + w + n);
}
const C = {
  vinte: cue('vinte'), colapsa: cue('colapsa'), explode: cue('explode'), luz: cue('luz'),
  neutrinos: cue('neutrinos', 1), particulas: cue('partículas'), trilhoes: cue('trilhões', 1),
  voce: cue('você', 1), sente: cue('sente'), pull: cue('supernova', 1) - .1, cinquenta: cue('cinquenta'),
  entao: cue('então'), parsec: cue('parsec'), banana: cue('banana'), chegue: cue('chegue'),
  netuno: cue('netuno'), ainda1: cue('ainda', 1), jupiter: cue('júpiter'), ainda2: cue('ainda', 2),
  duas: cue('duas'), cinturao: cue('cinturão'), quatro: cue('quatro', 1), letal: cue('letal'),
  clarao: cue('clarão'), centenas: cue('centenas'), bomba: cue('bomba'), olho: cue('olho'),
  oculos: cue('óculos'), ajudar: cue('ajudar'), em: cue('em'), trilhoes2: cue('trilhões', 2),
  terra: cue('terra'), detectores: cue('detectores'), vinte2: cue('vinte', 2), podem: cue('podem'),
  matar: cue('matar', 1), antes: cue('antes')
};
window.CUES = C;

// ---------- dois relógios ----------
// ambiente: brilho das estrelas, giro, flutuação  |  história: eventos (volta no rewind)
const RW0 = C.em, RW1 = C.em + .8, RW_BACK = 11.3;
function storyT(t) {
  if (t < RW0) return t;
  if (t < RW1) return lerp(RW0, RW_BACK, easeIO((t - RW0) / .8));
  return RW_BACK + .38 * (t - RW1);
}
const afterRewind = t => t >= RW1;

// ---------- mundo ----------
const S = { x: -960, y: 0 };          // estrela
const E = { x: 520, y: 40, r: 120 };  // Terra
const STAR_R = 300;
const UX = (() => { const dx = E.x - S.x, dy = E.y - S.y, l = Math.hypot(dx, dy); return { x: dx / l, y: dy / l, l }; })();
const PC_AU = 206265;
const Rof = d => UX.l * Math.log(d / .5) / Math.log(PC_AU / .5);   // raio no mapa (escala log)
const doseAt = d => 4 * (2.3 / d) ** 2;                               // Sv, lei do inverso do quadrado

function distAt(s) {             // UA, interpolado em escala log
  const L = Math.log;
  const seg = (a, b, t0, t1) => Math.exp(lerp(L(a), L(b), easeIO((s - t0) / (t1 - t0))));
  if (s < C.chegue) return PC_AU;
  if (s < C.netuno + .2) return seg(PC_AU, 30, C.chegue, C.netuno + .2);
  if (s < C.jupiter) return seg(30, 5.2, C.netuno + .4, C.jupiter + .1);
  if (s < C.duas) return 5.2;
  return seg(5.2, 2.3, C.duas, C.cinturao + .3);
}

// ---------- câmera ----------
const KEYS = [
  [0, -600, 0, 2.25],
  [C.explode + .5, -640, 0, 2.08],
  [C.explode + 2.1, 0, 0, 1.0],
  [C.particulas, 40, 10, 1.06],
  [C.particulas + 1.3, E.x - 20, E.y, 2.3],
  [C.pull, E.x - 30, E.y, 2.42],
  [C.pull + 3.1, -260, 0, .3],
  [C.entao, -330, 0, .32],
  [C.entao + 1.3, -600, 0, .44],
  [C.parsec, -620, 0, .46]
];
function keyCam(s) {
  if (s <= KEYS[0][0]) return { x: KEYS[0][1], y: KEYS[0][2], z: KEYS[0][3] };
  for (let i = 0; i < KEYS.length - 1; i++) {
    const a = KEYS[i], b = KEYS[i + 1];
    if (s <= b[0]) {
      const u = easeIO((s - a[0]) / (b[0] - a[0]));
      return { x: lerp(a[1], b[1], u), y: lerp(a[2], b[2], u), z: Math.exp(lerp(Math.log(a[3]), Math.log(b[3]), u)) };
    }
  }
  const k = KEYS[KEYS.length - 1]; return { x: k[1], y: k[2], z: k[3] };
}
function pathPoint(R) { return { x: S.x + UX.x * R, y: S.y + UX.y * R }; }
function journeyCam(s) {
  const R = Rof(distAt(s));
  const z = 1500 / (R + 260);
  const p = pathPoint(R * .5);
  return { x: p.x, y: p.y + 60 / z, z };
}
function mixCam(a, b, u) {
  return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), z: Math.exp(lerp(Math.log(a.z), Math.log(b.z), u)) };
}
function storyCam(s) {
  let c = keyCam(s);
  if (s > C.parsec) c = mixCam(c, journeyCam(s), easeIO((s - C.parsec) / 1.4));
  // foco no astronauta para os óculos
  const f = easeIO((s - (C.oculos - .35)) / .6) * (1 - easeIO((s - (C.ajudar + .5)) / .7));
  if (f > 0) {
    const a = astroWorld(s);
    c = mixCam(c, { x: a.x + 30 / c.z, y: a.y - 20 / c.z, z: c.z * 1.9 }, f);
  }
  return c;
}
const FINAL_CAM = { x: -60, y: -300, z: .62 };
function camera(t, a) {
  const s = storyT(t);
  let c = storyCam(s);
  if (t > C.podem - .2) c = mixCam(c, FINAL_CAM, easeIO((t - (C.podem - .2)) / 2.2));
  // respiração contínua: nada fica parado
  c.x += 7 * Math.sin(a * .23) / c.z; c.y += 5 * Math.sin(a * .31 + 1) / c.z;
  c.z *= 1 + .012 * Math.sin(a * .19);
  // tremidas
  const sh = 26 * kick(s - C.explode, .35, 22) + 16 * kick(s - C.letal, .35, 24) + 10 * kick(s - C.clarao, .4, 20);
  c.x += sh * Math.sin(a * 61) / c.z; c.y += sh * Math.cos(a * 47) / c.z;
  return c;
}
let CAM = { x: 0, y: 0, z: 1 };
const ws = (x, y) => ({ x: W / 2 + (x - CAM.x) * CAM.z, y: H / 2 + (y - CAM.y) * CAM.z });

// ---------- canvas ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const glc = document.getElementById('gl');
const scratch = document.createElement('canvas'); scratch.width = W; scratch.height = H;
const sctx = scratch.getContext('2d');

// ---------- fundo: nebulosas e estrelas ----------
const NEB = [
  { x: -500, y: -300, r: 1100, c: [24, 150, 160], a: .20, d: .05 },
  { x: 700, y: 250, r: 1200, c: [40, 95, 195], a: .16, d: .08 },
  { x: -200, y: 450, r: 900, c: [220, 95, 110], a: .10, d: .1 },
  { x: 1100, y: -400, r: 1000, c: [60, 70, 175], a: .15, d: .06 },
  { x: -1300, y: 200, r: 1000, c: [24, 150, 160], a: .14, d: .09 }
];
const STAR_LAYERS = [.12, .35, .6].map((d, li) => {
  const r = rng(77 + li * 31), n = [420, 240, 120][li], arr = [];
  for (let i = 0; i < n; i++) arr.push({
    x: r() * 2400, y: r() * 1500, s: [0.9, 1.4, 2.1][li] * (.6 + r() * .8),
    ph: r() * 6.28, f: .6 + r() * 2.2, sp: li === 2 && r() < .4, hue: r()
  });
  return { d, arr };
});
function drawBackground(a, dim) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#081d2c'); g.addColorStop(1, '#102348');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const n of NEB) {
    const k = Math.pow(CAM.z, n.d * 2);
    const x = W / 2 + (n.x - CAM.x * n.d) * k * .9 + 40 * Math.sin(a * .05 + n.x);
    const y = H / 2 + (n.y - CAM.y * n.d) * k * .9 + 30 * Math.cos(a * .04 + n.y);
    const rg = ctx.createRadialGradient(x, y, 0, x, y, n.r * k);
    rg.addColorStop(0, `rgba(${n.c},${n.a})`); rg.addColorStop(.55, `rgba(${n.c},${n.a * .45})`); rg.addColorStop(1, `rgba(${n.c},0)`);
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  }
  for (const L of STAR_LAYERS) {
    const k = Math.pow(CAM.z, L.d * .6);
    for (const p of L.arr) {
      let x = ((p.x - CAM.x * L.d * CAM.z * .35) * k) % 2400; if (x < 0) x += 2400; x -= 240;
      let y = ((p.y - CAM.y * L.d * CAM.z * .35) * k) % 1500; if (y < 0) y += 1500; y -= 210;
      if (x < -20 || x > W + 20 || y < -20 || y > H + 20) continue;
      const tw = .55 + .45 * Math.sin(a * p.f + p.ph);
      const al = (.35 + .65 * tw) * (L.d === .6 ? .95 : L.d === .35 ? .75 : .5);
      const col = p.hue < .7 ? '255,255,255' : p.hue < .85 ? '170,230,255' : '255,225,170';
      if (p.sp) {
        const s = p.s * (2.2 + 1.6 * tw);
        ctx.fillStyle = `rgba(${col},${al})`;
        ctx.beginPath();
        ctx.moveTo(x, y - s * 2); ctx.quadraticCurveTo(x, y, x + s * 2, y); ctx.quadraticCurveTo(x, y, x, y + s * 2);
        ctx.quadraticCurveTo(x, y, x - s * 2, y); ctx.quadraticCurveTo(x, y, x, y - s * 2); ctx.fill();
      } else {
        ctx.fillStyle = `rgba(${col},${al})`;
        ctx.beginPath(); ctx.arc(x, y, p.s * (.8 + .3 * tw), 0, 6.283); ctx.fill();
      }
    }
  }
  ctx.restore();
}

// ---------- a estrela (supergigante) ----------
const GRAN = (() => { const r = rng(5), a = []; for (let i = 0; i < 28; i++) a.push({ ang: r() * 6.28, rad: Math.sqrt(r()) * .85, s: .05 + r() * .08, sp: (r() - .5) * .25, ph: r() * 6 }); return a; })();
function starScale(s) {
  if (s < C.colapsa) return 1;
  const d = s - C.colapsa;
  if (d < .22) return 1 + .06 * easeOutCubic(d / .22);
  if (d < .55) return lerp(1.06, .035, easeInCubic((d - .22) / .33));
  return .035 * (1 + .25 * Math.sin(d * 40) * Math.exp(-(d - .55) * 2));
}
function drawStar(s, a) {
  if (s >= C.explode) return drawRemnant(s, a);
  const p = ws(S.x, S.y), R = STAR_R * starScale(s) * CAM.z;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  // anéis de halo aditivos
  [[1.23, .16], [1.48, .1], [1.76, .065], [2.1, .045]].forEach(([k, al], i) => {
    const rg = ctx.createRadialGradient(p.x, p.y, R * .9, p.x, p.y, R * k);
    rg.addColorStop(0, `rgba(255,170,90,${al})`); rg.addColorStop(1, 'rgba(255,140,80,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(p.x, p.y, R * k, 0, 6.283); ctx.fill();
  });
  // 18 cunhas de raio, girando devagar
  for (let i = 0; i < 18; i++) {
    const an = i / 18 * 6.283 + a * .03, w = .05 + .02 * Math.sin(i * 3.1);
    const rg = ctx.createRadialGradient(p.x, p.y, R, p.x, p.y, R * 2.6);
    rg.addColorStop(0, 'rgba(255,200,120,.06)'); rg.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.moveTo(p.x, p.y);
    ctx.arc(p.x, p.y, R * 2.6, an - w, an + w); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // disco
  const g = ctx.createRadialGradient(p.x - R * .25, p.y - R * .25, R * .05, p.x, p.y, R);
  g.addColorStop(0, '#fff7dc'); g.addColorStop(.45, '#ffc857'); g.addColorStop(1, '#ff8f4a');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, 6.283); ctx.fill();
  // grânulos brilhantes
  ctx.save(); ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, 6.283); ctx.clip();
  ctx.globalCompositeOperation = 'lighter';
  for (const q of GRAN) {
    const an = q.ang + a * q.sp, rr = q.rad * R, x = p.x + Math.cos(an) * rr, y = p.y + Math.sin(an) * rr;
    const sz = q.s * R * (1 + .2 * Math.sin(a * 1.3 + q.ph));
    const rg = ctx.createRadialGradient(x, y, 0, x, y, sz);
    rg.addColorStop(0, 'rgba(255,240,200,.22)'); rg.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = rg; ctx.fillRect(x - sz, y - sz, sz * 2, sz * 2);
  }
  ctx.restore();
}
function drawRemnant(s, a) {
  const p = ws(S.x, S.y), z = CAM.z, d = s - C.explode;
  const boost = 1 + 1.5 * smooth(C.clarao - .1, C.clarao + .5, s);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  // concha em expansão
  const sr = (40 + 70 * Math.sqrt(Math.max(d, 0))) * z;
  for (const [k, c, al] of [[1, '143,216,230', .16], [.82, '220,95,110', .1], [1.15, '60,70,175', .1]]) {
    const r = sr * k, rg = ctx.createRadialGradient(p.x, p.y, r * .55, p.x, p.y, r);
    rg.addColorStop(0, `rgba(${c},0)`); rg.addColorStop(.8, `rgba(${c},${al})`); rg.addColorStop(1, `rgba(${c},0)`);
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.283); ctx.fill();
  }
  // brilho do núcleo
  const pulse = 1 + .05 * Math.sin(a * 3);
  for (const [k, al] of [[3.6, .18], [1.9, .35], [1, .9]]) {
    const r = 46 * k * z * pulse * (k > 1 ? boost : 1);
    const rg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
    rg.addColorStop(0, `rgba(235,250,255,${al})`); rg.addColorStop(.4, `rgba(160,225,255,${al * .5})`); rg.addColorStop(1, 'rgba(120,200,255,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.283); ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(p.x, p.y, 13 * z * pulse, 0, 6.283); ctx.fill();
}
function drawShock(s) {
  const d = s - C.explode; if (d < 0 || d > 1.1) return;
  const p = ws(S.x, S.y), u = d / 1.1;
  const r = easeOutCubic(u) * 2600 * CAM.z + 20;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const w = 120 * CAM.z * (1 - u) + 20;
  const rg = ctx.createRadialGradient(p.x, p.y, Math.max(0, r - w), p.x, p.y, r + w * .3);
  rg.addColorStop(0, 'rgba(160,230,255,0)'); rg.addColorStop(.75, `rgba(200,245,255,${.55 * (1 - u)})`); rg.addColorStop(1, 'rgba(200,245,255,0)');
  ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(p.x, p.y, r + w * .3, 0, 6.283); ctx.fill();
  ctx.restore();
}

// ---------- fluxo de neutrinos e de luz ----------
const STREAKS = (() => { const r = rng(91), a = []; for (let i = 0; i < 1100; i++) a.push({ lat: (r() - .5) * 3400, ph: r(), v: .85 + r() * .3, len: .6 + r() * .8, light: r() < .06 }); return a; })();
function drawStreaks(s, t) {
  if (s < C.luz) return;
  const v = 1500, Lmax = 4200;
  const nx = UX.x, ny = UX.y, px = -ny, py = nx;
  const frontN = (s - C.neutrinos) * v * 1.3, frontL = (s - C.luz) * v * 1.3;
  const dense = 1 + 1.4 * smooth(C.trilhoes2 - .3, C.trilhoes2 + .6, t) * (afterRewind(t) ? 1 : 0);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  const n = Math.floor(STREAKS.length * Math.min(1, .55 * dense));
  for (let i = 0; i < n; i++) {
    const q = STREAKS[i];
    const isLight = q.light;
    const front = isLight ? frontL : frontN;
    if (front <= 0) continue;
    const along = ((s * v * q.v + q.ph * Lmax) % Lmax);
    if (along > front) continue;
    const len = 110 * q.len;
    const x = S.x + nx * along + px * q.lat, y = S.y + ny * along + py * q.lat;
    const a1 = ws(x, y), a0 = ws(x - nx * len, y - ny * len);
    if ((a1.x < -50 && a0.x < -50) || a0.x > W + 50 || a1.y < -50 || a1.y > H + 50) continue;
    const g = ctx.createLinearGradient(a0.x, a0.y, a1.x, a1.y);
    const c = isLight ? '255,217,138' : '143,236,255';
    g.addColorStop(0, `rgba(${c},0)`); g.addColorStop(1, `rgba(${c},${isLight ? .9 : .55})`);
    ctx.strokeStyle = g; ctx.lineWidth = isLight ? 3.2 : 2.2;
    ctx.beginPath(); ctx.moveTo(a0.x, a0.y); ctx.lineTo(a1.x, a1.y); ctx.stroke();
  }
  ctx.restore();
}

// ---------- texto ----------
const FONT = (w, px) => `${w} ${px}px Fredoka`;
const COL = { teal: '#8fd8e6', gold: '#ffd98a', white: '#ffffff', coral: '#ff8a7a' };
// linha que sobe 1,3x a própria altura através de um recorte (ease-out-quint)
function riseText(str, x, y, px, color, t, t0, t1 = 1e9, opt = {}) {
  if (t < t0 || t > t1 + .6) return 0;
  ctx.save();
  ctx.font = FONT(opt.w || 700, px); ctx.letterSpacing = (opt.ls ?? 5) + 'px';
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  const w = ctx.measureText(str).width + (opt.ls ?? 5) * str.length, h = px * 1.15;
  const x0 = opt.align === 'left' ? x : x - w / 2;
  const uIn = easeOutQuint((t - t0) / .55), uOut = easeInCubic((t - t1) / .45);
  const off = (1 - uIn) * h * 1.3 + uOut * h * 1.3;
  ctx.beginPath(); ctx.rect(x0 - 20, y - px * .95, w + 40, h * 1.05); ctx.clip();
  ctx.fillStyle = color; ctx.fillText(str, x0, y + off);
  ctx.restore();
  return w;
}
// pílula arredondada com linhas que sobem
function pill(lines, cx, cy, t, t0, t1 = 1e9, opt = {}) {
  if (t < t0 || t > t1 + .6) return;
  ctx.save();
  const pad = opt.pad ?? 26, gap = opt.gap ?? 10;
  let wmax = 0, htot = 0;
  for (const L of lines) { ctx.font = FONT(L.w || 700, L.px); ctx.letterSpacing = (L.ls ?? 5) + 'px'; wmax = Math.max(wmax, ctx.measureText(L.s).width + (L.ls ?? 5) * (L.s.length - 1)); htot += L.px * 1.12; }
  htot += gap * (lines.length - 1);
  const pw = wmax + pad * 2, ph = htot + pad * 1.3;
  const sIn = spring(t - t0, .5, 15), sOut = 1 - easeInCubic((t - t1) / .5);
  const sc = Math.max(0, sIn * sOut);
  if (sc <= .001) { ctx.restore(); return; }
  ctx.translate(cx, cy); ctx.scale(lerp(.6, 1, sc), lerp(.6, 1, sc));

// ---------- órbitas, cinturão, rótulos que andam no anel ----------
const ROCKS = (() => { const r = rng(311), a = []; for (let i = 0; i < 420; i++) a.push({ d: 2.1 + r() * 1.2, ang: r() * 6.283, s: .6 + r() * 1.4, sp: .01 + r() * .02 }); return a; })();
function drawOrbits(s, t, a) {
  const vis = smooth(C.parsec - .4, C.parsec + .6, s);

  ctx.save();
  // anéis tracejados de Netuno e Júpiter
  for (const [d, col, t0] of [[30, '143,216,230', C.parsec], [5.2, '255,217,138', C.parsec + .2]]) {
    const r = Rof(d) * CAM.z;

    ctx.strokeStyle = `rgba(${col},${.35 * vis})`; ctx.lineWidth = 2.5; ctx.setLineDash([10, 14]); ctx.lineDashOffset = -a * 12;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, -Math.PI * u, Math.PI * u); ctx.stroke();
  }
  ctx.setLineDash([]);

    const ang = q.ang + a * q.sp, R = Rof(q.d) * CAM.z;

  }

  ctx.globalAlpha = vis; ctx.fillStyle = ng; ctx.beginPath(); ctx.arc(np.x, np.y, nr, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;

  const belt = { x: S.x + Math.cos(-.95) * Rof(2.7), y: S.y + Math.sin(-.95) * Rof(2.7) };
  lab(belt, [{ s: 'CINTURÃO DE ASTEROIDES', px: 28, c: COL.white }], C.cinturao - .1, C.clarao, -10);
}

// ---------- frente de neutrinos (zona com 30 px de borda suave) ----------
function frontR(s) {
  const r0 = 46, rT = Rof(2.3);

  if (s < C.letal) { const u = (s - C.duas) / (C.letal - C.duas); return r0 + (rT - r0) * (.45 * u + .55 * u ** 6); }

}
function drawFront(s) {
  const fr = frontR(s); if (fr < 0) return;
  const p = ws(S.x, S.y), r = fr * CAM.z, soft = 15;

}

// ---------- HUD da jornada: distância e dose ----------
function fmtDist(d) {
  if (d > 1000) return fmtInt(d) + ' UA';
  if (d >= 10) return Math.round(d) + ' UA';
  return fmtDec(d, 1) + ' UA';
}
function fmtDose(sv) {
  if (sv >= 1) return fmtDec(sv, sv >= 3.95 ? 0 : 1) + ' Sv';
  if (sv >= 1e-3) return fmtDec(sv * 1e3, sv >= .01 ? 0 : 1) + ' mSv';
  if (sv >= 1e-6) return fmtDec(sv * 1e6, 1) + ' µSv';
  return fmtDec(sv * 1e9, 1) + ' nSv';
}
function drawHUD(s, t, a) {
  if (s < C.parsec - .1 || s > C.ajudar + 1.2) return;
  const out = C.ajudar + .4;
  const d = distAt(s), dose = doseAt(d);
  const lethal = s >= C.letal;
  // distância
  pill([{ s: 'DISTÂNCIA', px: 22, c: COL.teal, ls: 6 }, { s: s < C.chegue ? '1 PARSEC' : fmtDist(d), px: 52, c: COL.white, ls: 3 }], 300, 120, s, C.parsec, out, { pad: 30 });
  // medidor de dose em escala log (1 nSv ... 10 Sv)
  const x0 = 560, x1 = 1640, y = 960, u0 = ramp(s, C.parsec + .15, .7) * (1 - ramp(s, out, .5));
  if (u0 <= 0) return;
  const lg = v => clamp((Math.log10(v) + 10) / 11);
  ctx.save();
  ctx.globalAlpha = u0;
  ctx.fillStyle = 'rgba(6,20,40,.62)'; ctx.beginPath(); ctx.roundRect(x0 - 40, y - 74, (x1 - x0 + 80) * easeOutQuint(u0), 140, 40); ctx.fill();
  ctx.fillStyle = 'rgba(143,216,230,.18)'; ctx.beginPath(); ctx.roundRect(x0, y - 9, x1 - x0, 18, 9); ctx.fill();
  const fillU = lg(dose);
  const barCol = lethal ? '#ff6f6a' : dose > .1 ? '#ffd98a' : '#8fd8e6';
  ctx.fillStyle = barCol; ctx.beginPath(); ctx.roundRect(x0, y - 9, Math.max(18, (x1 - x0) * fillU), 18, 9); ctx.fill();
  ctx.font = FONT(600, 20); ctx.letterSpacing = '3px'; ctx.textAlign = 'center';
  for (const [v, l] of [[1e-9, '1 nSv'], [1e-6, '1 µSv'], [1e-3, '1 mSv'], [1, '1 Sv']]) {
    const x = x0 + (x1 - x0) * lg(v);
    ctx.fillStyle = 'rgba(143,216,230,.7)'; ctx.fillRect(x - 1.5, y + 14, 3, 12);
    ctx.fillText(l, x, y + 50);
  }

  ctx.fillStyle = '#ff8a7a'; ctx.fillRect(xl - 2, y - 26, 4, 52);
  ctx.fillText('LETAL', xl, y + 50);
  ctx.restore();
  // ponteiro com leitura ao vivo
  const xp = x0 + (x1 - x0) * fillU;
  pill([{ s: 'DOSE  ' + fmtDose(dose), px: 30, c: lethal ? COL.coral : COL.white, ls: 4 }], clamp(xp, x0 + 140, x1 - 120), y - 44 - 26, s, C.parsec + .35, out, { pad: 20 });
  // banana: 1 banana ~ 0,25 µSv
  if (s > C.banana - .05 && s < C.chegue + 2.2) {

    drawBanana(xb, y - 150 + (1 - sp) * -260 + easeInCubic((s - C.chegue - 1.5) / .6) * 400, .9 * sp + .01, -.2 + .15 * Math.sin(a * 1.5));
    pill([{ s: '1 BANANA', px: 24, c: COL.gold }], xb, y - 230, s, C.banana + .15, C.chegue + 1.5, { pad: 16 });

          const g = ctx.createRadialGradient(x, gy, 0, x, gy, r * 1.6);
          g.addColorStop(0, 'rgba(200,250,255,1)'); g.addColorStop(.5, 'rgba(143,236,255,.8)'); g.addColorStop(1, 'rgba(143,236,255,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, gy, r * 1.6, 0, 6.283); ctx.fill(); ctx.restore();
        }
      });
    }
    // final: um neutrino marcado "2,3 UA" atravessa a tela
    if (t > C.podem) {
      const u = (t - C.podem) / 3.6;
      const x = lerp(-200, W + 300, u), y = lerp(880, 610, u);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createLinearGradient(x - 340, y + 70, x, y);
      g.addColorStop(0, 'rgba(143,236,255,0)'); g.addColorStop(1, 'rgba(143,236,255,.95)');
      ctx.strokeStyle = g; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x - 340, y + 70); ctx.lineTo(x, y); ctx.stroke();
      const rg = ctx.createRadialGradient(x, y, 0, x, y, 40);
      rg.addColorStop(0, 'rgba(220,250,255,1)'); rg.addColorStop(1, 'rgba(143,236,255,0)');
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, y, 40, 0, 6.283); ctx.fill();
      ctx.restore();
      if (u < 1) pill([{ s: 'LETAL SÓ A 2,3 UA', px: 28, c: COL.teal }], x, y - 70, t, C.podem + .2, C.antes - .3, { pad: 18 });
    }
    drawTitle(t);
  }
  drawRewindFX(t);
  finish(t);
}

// ---------- API ----------
window.seek = function (t) { draw(clamp(t, 0, DUR)); return true; };
// motion blur: 2 subquadros, obturador 0,6
window.renderFrame = function (i) {
  const t = i / FPS, sh = .6 / FPS;
  draw(t - sh / 4);
  sctx.globalAlpha = 1; sctx.drawImage(cv, 0, 0);
  draw(t + sh / 4);
  ctx.save(); ctx.globalAlpha = .5; ctx.drawImage(scratch, 0, 0); ctx.restore();
  return true;
};
window.DUR = DUR; window.FPS = FPS;
document.fonts.load('700 40px Fredoka').then(() => document.fonts.load('600 40px Fredoka')).then(() => { window.READY = true; seek(0); });
</script>
