const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
function cue(w, n = 1) {
  let k = 0;
  for (const x of WORDS) if (norm(x.w) === norm(w) && ++k === n) return x.t0;
  throw new Error('cue ' + w + n);
}
const C = {
  mais: cue('mais', 1), flores: cue('flores'), comida: cue('comida'), tres: cue('três'), quatro: cue('quatro'), real: cue('real'),
  so: cue('só', 1), robos: cue('abelhas-robôs', 1), pesquisadores: cue('pesquisadores'), mit1: cue('mit', 1), clipe: cue('clipe'),
  dezessete: cue('dezessete'), futuro: cue('futuro'), fazendas: cue('fazendas'), sombrio: cue('sombrio'), black1: cue('black', 1), esse: cue('esse'),
  hackeia: cue('hackeia'), armas: cue('armas'), agora: cue('fizesse') - .8, mit2: cue('mit', 2), quem: cue('quem'), culpado: cue('culpado'),
  fabricante: cue('fabricante'), hacker: cue('hacker'), nos: cue('nós'), abelha: cue('abelha'), carro: cue('carro'), drone: cue('drone'),
  lista: cue('lista'), cresce: cue('aumenta'), tecnologia1: cue('tecnologia', 1), quanto: cue('quanto'), riscos1: cue('riscos', 1),
  riscos2: cue('riscos', 2), ponto: cue('ponto'), questionar: cue('questionar'), porque: cue('questionar') + 1.0, parece: cue('parece')
};
C.DUR = DUR; C.TITLE = C.porque + .6;
window.CUES = C;

// ---------- dois relógios ----------
// ambiente (a = t): brilho das estrelas, giro, flutuação  |  história (s): eventos, volta no rewind
// ---------- dois relógios: rewind de 0,8 s em "Porque" de volta à abelha-robô reanimando a flor ----------
const RW0 = C.porque - .25, RW1 = RW0 + .8, SLOW = .05;
const RW_BACK = C.robos + .2;
function storyT(t) {
  if (t < RW0) return t;
  if (t < RW1) return lerp(RW0, RW_BACK, easeIO((t - RW0) / .8));
  return RW_BACK + SLOW * (t - RW1);
}

// ---------- canvas e camadas ----------
const cv = document.getElementById('c');
const mctx = cv.getContext('2d');
let ctx = mctx;
const mk2d = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const LA = mk2d(), LB = mk2d(), scratch = mk2d(), FX = mk2d();
const sctx = scratch.getContext('2d');
let CAM = { x: 0, y: 0, z: 1 };
const ws = (x, y) => ({ x: W / 2 + (x - CAM.x) * CAM.z, y: H / 2 + (y - CAM.y) * CAM.z });
function applyCam() { ctx.setTransform(CAM.z, 0, 0, CAM.z, W / 2 - CAM.x * CAM.z, H / 2 - CAM.y * CAM.z); }
function screenSpace() { ctx.setTransform(1, 0, 0, 1, 0, 0); }
function mixCam(a, b, u) {
  return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), z: Math.exp(lerp(Math.log(a.z), Math.log(b.z), u)) };
}
// quadros-chave de câmera: [s, x, y, z] em easeInOutCubic, zoom em espaço log
function keyed(keys, s) {
  if (s <= keys[0][0]) return { x: keys[0][1], y: keys[0][2], z: keys[0][3] };
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (s <= b[0]) return mixCam({ x: a[1], y: a[2], z: a[3] }, { x: b[1], y: b[2], z: b[3] }, easeIO((s - a[0]) / (b[0] - a[0])));

}
function breathe(c, a, amt = 1) {
  return { x: c.x + amt * 7 * Math.sin(a * .23) / c.z, y: c.y + amt * 5 * Math.sin(a * .31 + 1) / c.z, z: c.z * (1 + amt * .012 * Math.sin(a * .19)) };
}
function shake(c, amp, a) { return { x: c.x + amp * Math.sin(a * 61) / c.z, y: c.y + amp * Math.cos(a * 47) / c.z, z: c.z }; }

// ---------- fundo, texto, grão ----------

//  TERRA (WebGL, ortográfica, mapa 2048x1024 de polígonos lon/lat)

const glc = document.getElementById('gl');
const gl = glc.getContext('webgl', { premultipliedAlpha: true, preserveDrawingBuffer: true, antialias: false });
const VS = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
const FS = `precision highp float;
uniform vec2 ctr; uniform float rot, tilt, crot, rad; uniform vec3 L;
uniform sampler2D day, mk;
const float PI = 3.14159265;
vec4 shade(vec2 frag){
  vec2 q = (frag - ctr) / rad;
  float d = dot(q,q);
  vec3 Ln = normalize(L);
  if (d > 1.) {
    float h = sqrt(d) - 1.;
    float lit = clamp(dot(normalize(vec3(q,0.)), Ln) * .6 + .5, 0., 1.);
    float a = exp(-h * 14.) * (.12 + .62 * lit);
    a *= 1. - smoothstep(.13, .18, h);
    vec3 c = mix(vec3(.30,.50,1.), vec3(.55,.88,1.), lit);
    return vec4(c * a, a);
  }
  vec3 N = vec3(q, sqrt(1. - d));
  float ct = cos(tilt), st = sin(tilt);
  vec3 B = vec3(ct*N.x + st*N.y, -st*N.x + ct*N.y, N.z);
  float lon = atan(B.x, B.z) + rot, lat = asin(clamp(B.y,-1.,1.));
  vec2 uv = vec2(fract(lon / (2.*PI) + .5), .5 - lat / PI);
  float ndl = dot(N, Ln);
  float dayk = smoothstep(-.12, .24, ndl);
  vec3 col = texture2D(day, uv).rgb;
  vec4 m = texture2D(mk, uv);
  float ocean = m.g, city = m.b;
  float cloud = texture2D(mk, vec2(fract(uv.x + crot), uv.y)).r;
  col = mix(col, vec3(1.), cloud * .9);
  vec3 night = vec3(.06,.12,.26) + col * .08;
  vec3 c = mix(night, col * (.75 + .25 * dayk), dayk);
  c += vec3(1.,.82,.45) * city * (1. - dayk) * 1.3;
  c += vec3(1.,.48,.40) * exp(-pow((ndl - .02) / .085, 2.)) * .35;
  vec3 Hh = normalize(Ln + vec3(0.,0.,1.));

  bo: [[109, -2], [117, 7], [119, 1], [116, -4]],
  su: [[95, 5], [106, -6], [104, -6], [97, 1]],
  ng: [[131, -1], [150, -6], [147, -10], [138, -8]],
  nz: [[172, -34], [178, -38], [174, -41], [167, -46], [170, -46], [174, -41]],

const BIOME = {
  desert: [[[-15, 16], [35, 16], [35, 30], [-10, 30]], [[38, 16], [55, 18], [57, 28], [40, 30]], [[120, -20], [140, -20], [140, -30], [120, -30]], [[90, 38], [115, 38], [115, 46], [90, 46]], [[-117, 28], [-105, 28], [-105, 38], [-117, 38]]],

function buildTextures() {
  const TW = 2048, TH = 1024;
  const P = (lon, lat) => [(lon + 180) / 360 * TW, (90 - lat) / 180 * TH];
  const poly = (c, pts) => { c.beginPath(); pts.forEach((q, i) => { const [x, y] = P(q[0], q[1]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.closePath(); c.fill(); };
  const land = document.createElement('canvas'); land.width = TW; land.height = TH;
  const lc = land.getContext('2d'); lc.fillStyle = '#5fc47a';
  Object.values(LAND).forEach(p => poly(lc, p));
  lc.globalCompositeOperation = 'source-atop';
  lc.fillStyle = '#48ad6b'; BIOME.forest.forEach(p => poly(lc, p));
  lc.fillStyle = '#f5c75f'; BIOME.desert.forEach(p => poly(lc, p));
  lc.fillStyle = '#3a9d62'; BIOME.rain.forEach(p => poly(lc, p));
  lc.fillStyle = '#f1f8ff'; BIOME.ice.forEach(p => poly(lc, p));
  const landData = lc.getImageData(0, 0, TW, TH).data;
  const day = document.createElement('canvas'); day.width = TW; day.height = TH;
  const dc = day.getContext('2d');
  const og = dc.createLinearGradient(0, 0, 0, TH);
  og.addColorStop(0, '#1a66b8'); og.addColorStop(.5, '#4dc7eb'); og.addColorStop(1, '#1a66b8');
  dc.fillStyle = og; dc.fillRect(0, 0, TW, TH);
  dc.save(); dc.filter = 'blur(10px)'; dc.globalAlpha = .45; dc.drawImage(land, 0, 0); dc.restore();
  dc.drawImage(land, 0, 0);
  const mk = document.createElement('canvas'); mk.width = TW; mk.height = TH;
  const mc = mk.getContext('2d');
  const md = mc.createImageData(TW, TH);
  for (let i = 0; i < TW * TH; i++) { md.data[i * 4 + 1] = landData[i * 4 + 3] > 10 ? 0 : 255; md.data[i * 4 + 3] = 255; }
  mc.putImageData(md, 0, 0);
  mc.globalCompositeOperation = 'lighter';
  const r = rng(2024); let n = 0, guard = 0;
  while (n < 380 && guard++ < 60000) {
    const lon = r() * 360 - 180, lat = (r() - .5) * 120;
    if (lat > 62 || lat < -45) continue;
    const [x, y] = P(lon, lat);
    const i = (Math.floor(y) * TW + Math.floor(x)) * 4;
    if (landData[i + 3] < 10 || (landData[i] > 230 && landData[i + 1] > 230)) continue;
    const rr = 2 + r() * 4;
    const g = mc.createRadialGradient(x, y, 0, x, y, rr * 2);
    g.addColorStop(0, 'rgba(0,0,255,1)'); g.addColorStop(1, 'rgba(0,0,255,0)');

    mc.fillStyle = `rgba(255,0,0,${.6 + r() * .4})`;
    mc.beginPath(); mc.roundRect(x - w / 2, y - h / 2, w, h, h / 2); mc.fill();
    if (r() < .5) { mc.beginPath(); mc.roundRect(x - w / 3 + 20, y + h * .7, w * .6, h * .8, h * .4); mc.fill(); }
  }
  const tex = (img, unit) => {
    const tx = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tx);

const ER = 300;                 // raio da Terra no mundo
const TILT = .26;
const D2R = Math.PI / 180;
// lon/lat -> vetor na vista (x direita, y cima, z para a câmera), mesma matemática do shader
function geoView(lon, lat, rot) {
  const L = lon * D2R - rot, B = lat * D2R;
  const bx = Math.cos(B) * Math.sin(L), by = Math.sin(B), bz = Math.cos(B) * Math.cos(L);
  const ct = Math.cos(TILT), st = Math.sin(TILT);
  return { x: ct * bx - st * by, y: st * bx + ct * by, z: bz };

function drawEarth(rot, a) {

  gl.uniform1f(U.rot, rot); gl.uniform1f(U.tilt, TILT); gl.uniform1f(U.crot, a * .0012);
  gl.uniform3f(U.L, Lv.x, Lv.y, Lv.z + .15);

function inPoly(x, y, P) { let c = false; for (let i = 0, j = P.length - 1; i < P.length; j = i++) { const [xi, yi] = P[i], [xj, yj] = P[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
// =====================================================================

const SKIN = '#e9b48f', SKIN_D = '#d99c78', SHIRT = '#1fa3a8', SHORTS = '#2b4f7a', HAIR = '#3b2a2e';
