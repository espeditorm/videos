  const u = easeIO((s - (C.click - 1.1)) / 1.0);
  const p = { x: lerp(p0.x, p1.x, u), y: lerp(p0.y, p1.y, u) - 60 * Math.sin(Math.PI * u) };
  if (s > C.teste) { const v = easeIO((s - C.teste) / .8); p.x = lerp(p.x, 600, v); p.y = lerp(p.y, 420, v); }
  return p;
}
function drawScreenScene(s, t, a) {
  CAM = screenCam(s, t, a);
  screenSpace(); drawBackground(a, 0);
  applyCam();
  // brilho, mesa, monitor
  const g = ctx.createRadialGradient(0, -40, 100, 0, -40, 1100);
  g.addColorStop(0, 'rgba(40,95,195,.28)'); g.addColorStop(1, 'rgba(40,95,195,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -40, 1100, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#2a3f63'; ctx.beginPath(); ctx.roundRect(-70, 380, 140, 120, 16); ctx.fill();
  ctx.fillStyle = '#34507a'; ctx.beginPath(); ctx.roundRect(-240, 486, 480, 34, 17); ctx.fill();
  ctx.fillStyle = '#1b2f4f'; ctx.beginPath(); ctx.roundRect(-660, -420, 1320, 830, 46); ctx.fill();
  const sg = ctx.createLinearGradient(0, -380, 0, 380);
  sg.addColorStop(0, '#12314e'); sg.addColorStop(1, '#0b1f35');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.roundRect(-620, -382, 1240, 750, 28); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.roundRect(-620, -382, 1240, 750, 28); ctx.clip();

    ctx.fillStyle = 'rgba(143,216,230,.35)'; ctx.fillRect(-520, y + 20, wtxt * kin, 3);
  });
  ctx.restore();
  // etiquetas TESTE / REAL e colchete "mesma lista"

    pill([{ s: 'TESTE', px: 28, c: COL.teal, ls: 5 }], bx - 120, ROW_Y(TEST), s, C.teste, C.confirmacao - .2, { pad: 14 });
    const kb = easeOutQuint((s - C.lista + .1) / .5), fade = 1 - easeIO((s - C.confirmacao + .2) / .4);
    if (kb > 0 && fade > 0) {
      ctx.save(); ctx.globalAlpha = fade;
      ctx.fillStyle = COL.gold; const y0 = ROW_Y(REAL), y1 = ROW_Y(TEST);
      ctx.beginPath(); ctx.roundRect(bx - 30, y0 - 4, 30, 8, 4); ctx.roundRect(bx - 30, lerp(y0, y1, kb) - 4, 30, 8, 4); ctx.roundRect(bx - 4, y0 - 4, 8, (y1 - y0) * kb + 8, 4); ctx.fill();
      ctx.restore();
      pill([{ s: 'MESMA LISTA', px: 30, c: COL.gold, ls: 5 }, { s: 'QUASE IGUAIS', px: 30, c: COL.white, ls: 5 }].slice(0, s > C.iguais - .05 ? 2 : 1),
        bx + 210, (ROW_Y(REAL) + ROW_Y(TEST)) / 2, s, C.lista, C.confirmacao - .2, { pad: 18 });
    }
  }
  // cursor e clique
  const cp = cursorPos(s);
  if (s > C.click - 1.3 && s < C.confirmacao) {

    if (s > C.click) {
      const u = (s - C.click) / .6;
      if (u < 1) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; const R = 20 + 90 * easeOutCubic(u); const rg = ctx.createRadialGradient(cp.x, cp.y, R * .6, cp.x, cp.y, R); rg.addColorStop(0, 'rgba(255,217,138,0)'); rg.addColorStop(.8, `rgba(255,217,138,${.7 * (1 - u)})`); rg.addColorStop(1, 'rgba(255,217,138,0)'); ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(cp.x, cp.y, R, 0, 6.283); ctx.fill(); ctx.restore(); }
    }
    ctx.save(); ctx.translate(cp.x, cp.y); ctx.scale(1.4 * (1 + ck), 1.4 * (1 - ck));
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.moveTo(4, 4); ctx.lineTo(4, 50); ctx.lineTo(16, 38); ctx.lineTo(28, 60); ctx.lineTo(36, 56); ctx.lineTo(24, 34); ctx.lineTo(40, 34); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 46); ctx.lineTo(12, 34); ctx.lineTo(24, 56); ctx.lineTo(32, 52); ctx.lineTo(20, 30); ctx.lineTo(36, 30); ctx.closePath(); ctx.fill();

  // dois diálogos idênticos
  const dlg = (x, lab, col, t0) => {
    const k = spring(s - t0, .45, 14), out = easeInCubic((s - C.existia) / .5);
    if (k <= 0 || out >= 1) return;
    ctx.save(); ctx.translate(x, lerp(0, -900, out)); ctx.scale(k, k);
    ctx.fillStyle = '#f3f7fb'; ctx.beginPath(); ctx.roundRect(-250, -140, 500, 280, 34); ctx.fill();
    ctx.fillStyle = '#d7e2ec'; ctx.beginPath(); ctx.roundRect(-250, 50, 500, 90, [0, 0, 34, 34]); ctx.fill();
    ctx.fillStyle = '#ff8a7a'; ctx.beginPath(); ctx.roundRect(-210, 68, 190, 56, 28); ctx.fill();
    ctx.fillStyle = '#b8c7d6'; ctx.beginPath(); ctx.roundRect(20, 68, 190, 56, 28); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.translate(x, lerp(0, -900, out)); ctx.scale(k, k);
    riseText('TEM CERTEZA', 0, -40, 48, '#0b1e33', s, t0 + .1, 1e9, { ls: 4 });
    riseText('SIM', -115, 108, 30, '#ffffff', s, t0 + .2, 1e9, { ls: 4 });
    riseText('NÃO', 115, 108, 30, '#0b1e33', s, t0 + .25, 1e9, { ls: 4 });
    ctx.restore();
    pill([{ s: lab, px: 32, c: col, ls: 6 }], x, lerp(-210, -1110, out), s, t0 + .1, C.existia - .1, { pad: 16 });
  };
  dlg(-330, 'TESTE', COL.teal, C.confirmacao - .05);
  dlg(330, 'REAL', COL.coral, C.confirmacao + .15);
  if (s > C.dois2 - .1 && s < C.existia + .3) {
    const k = spring(s - C.dois2, .45, 15), out = 1 - easeIO((s - C.existia) / .3);
    ctx.save(); ctx.translate(0, 0); ctx.scale(k * out, k * out);
    ctx.fillStyle = COL.gold; ctx.beginPath(); ctx.roundRect(-36, -26, 72, 16, 8); ctx.roundRect(-36, 10, 72, 16, 8); ctx.fill();
    ctx.restore();
  }
  // cartão de correção vazio
  if (s > C.existia + .1) {
    const k = spring(s - (C.existia + .2), .5, 13);
    ctx.save(); ctx.translate(0, lerp(500, 0, k));
    ctx.fillStyle = '#f3f7fb'; ctx.beginPath(); ctx.roundRect(-380, -200, 760, 400, 40); ctx.fill();
    ctx.fillStyle = '#d7e2ec'; ctx.beginPath(); ctx.roundRect(-330, -60, 660, 200, 22); ctx.fill();
    if (Math.floor(a * 2.2) % 2 === 0) { ctx.fillStyle = '#1a66b8'; ctx.beginPath(); ctx.roundRect(-306, -36, 6, 50, 3); ctx.fill(); }
    ctx.restore();
    ctx.save(); ctx.translate(0, lerp(500, 0, k));
    riseText('MENSAGEM DE CORREÇÃO', 0, -110, 40, '#0b1e33', s, C.existia + .35, 1e9, { ls: 4 });
    ctx.restore();
    // carimbo "NÃO EXISTIA"
    const ks = spring(s - C.desmentir, .42, 15);

      ctx.save(); ctx.translate(40, 60); ctx.rotate(-.12); const sc = lerp(1.8, 1, ks); ctx.scale(sc, sc); ctx.globalAlpha = clamp(ks * 2);
      ctx.fillStyle = '#ff5f6d'; ctx.beginPath(); ctx.roundRect(-250, -56, 500, 112, 30); ctx.fill();

      riseText('NÃO EXISTIA', 0, 20, 58, '#ffffff', s, C.desmentir + .03, 1e9, { ls: 6 });

}

// =====================================================================
//  CENA 4: JIM CARREY ACORDA (varanda de frente para a praia)
// =====================================================================
function bathCam(s, a) {
  let c = keyed([[T.t6, 0, -150, .55], [T.t6 + .8, 0, -170, .88], [C.acordou, 20, -190, 1.0], [C.dez - .1, 60, -230, 1.3], [C.FA + .1, 70, -240, 1.42], [C.FA + 1.2, 50, -230, 1.48]], s);
  c = breathe(c, a);
  return shake(c, 6 * kick(s - C.FA, .4, 20), a);
}
function drawBedScene(s, t, a) {
  CAM = bathCam(s, a);
  drawBeach(a, { shadow: false });
  applyCam();
  // varanda de madeira de frente para o mar (sem contornos)
  ctx.fillStyle = '#a86e48'; ctx.fillRect(-4000, 150, 8000, 3000);
  for (let k = 0; k < 9; k++) { ctx.fillStyle = k % 2 ? '#9a6440' : '#b5784f'; ctx.fillRect(-4000, 150 + k * 46, 8000, 23); }
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(-4000, 150, 8000, 14);

  ctx.beginPath(); ctx.roundRect(-1500, 8, 3000, 22, 11); ctx.fill();
  ctx.fillStyle = '#d7e2ec'; ctx.beginPath(); ctx.roundRect(-1500, 26, 3000, 6, 3); ctx.fill();
  // espreguiçadeira: encosto atrás dele
  ctx.fillStyle = '#c98a5e'; ctx.beginPath(); ctx.roundRect(-230, -250, 480, 300, [50, 50, 10, 10]); ctx.fill();
  ctx.fillStyle = '#f3f7fb'; ctx.beginPath(); ctx.roundRect(-200, -220, 420, 250, 40); ctx.fill();

  ctx.fillStyle = '#ffd98a'; for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.roundRect(-250 + k * 120, -60, 40, 110, 20); ctx.fill(); }
  ctx.fillStyle = '#a86e48'; ctx.beginPath(); ctx.roundRect(-260, 70, 26, 90, 12); ctx.roundRect(280, 70, 26, 90, 12); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(30, 168, 360, 16, 0, 0, 6.283); ctx.fill();
  drawCat(320, -70, .8, s, a, T.t6 + .3, s < C.FA ? hand : { x: 0, y: -300 });
  screenSpace();
  pill([{ s: 'JIM CARREY ESCREVEU', px: 32, c: COL.teal, ls: 5 }], W / 2, 100, s, C.escreveu, C.trinta2 - .1, { pad: 18 });
  pill([{ s: 'ACORDEI NO HAVAÍ', px: 36, c: COL.white, ls: 5 }, { s: 'COM 10 MINUTOS DE VIDA', px: 36, c: COL.gold, ls: 5 }], 1500, 560, s, C.acordou, C.FA - .05);
  pill([{ s: '08:45 · ALARME FALSO', px: 34, c: COL.gold, ls: 5 }], W / 2, H - 110, s, C.FA + .05, C.trinta2 + .3, { pad: 18 });
}

// =====================================================================
//  COMPOSIÇÃO: cenas por tempo da história, transições em íris
// =====================================================================
const SCENES = { globe: drawGlobe, man: drawManScene, screen: drawScreenScene, bath: drawBedScene };
const TRANS = [
  { s: T.t1, from: 'globe', to: 'man', mode: 'open' },
  { s: T.t2, from: 'man', to: 'globe', mode: 'close' },
  { s: T.t3, from: 'globe', to: 'man', mode: 'open' },
  { s: T.t4, from: 'man', to: 'globe', mode: 'close' },
  { s: T.t5, from: 'globe', to: 'screen', mode: 'open' },
  { s: T.t6, from: 'screen', to: 'bath', mode: 'open' }
];
function sceneAt(s) { let n = 'globe'; for (const tr of TRANS) if (s >= tr.s + TD) n = tr.to; return n; }
function renderLayer(name, s, t, a, layer) {
  const c = layer.getContext('2d'); ctx = c; c.setTransform(1, 0, 0, 1, 0, 0);
  SCENES[name](s, t, a); c.setTransform(1, 0, 0, 1, 0, 0); ctx = mctx;
  return layer;
}
function focusOnGlobe(s, a) { const cam = globeCam(s, a); const saved = CAM; CAM = cam; const h = honW(s, a); const p = ws(h.x, h.y); CAM = saved; return p; }
let CUR_T = 0;
function draw(t) {
  CUR_T = t;
  const a = t, s = storyT(t);
  ctx = mctx; mctx.setTransform(1, 0, 0, 1, 0, 0);
  const tr = TRANS.find(q => s >= q.s && s < q.s + TD);
  if (!tr) {
    renderLayer(sceneAt(s), s, t, a, LA); mctx.drawImage(LA, 0, 0);
  } else {
    const u = (s - tr.s) / TD, maxR = Math.hypot(W, H);
    const f = (tr.from === 'globe' || tr.to === 'globe') ? focusOnGlobe(s, a) : { x: W / 2, y: H / 2 };
    if (tr.mode === 'open') {
      renderLayer(tr.from, s, t, a, LA); mctx.drawImage(LA, 0, 0);
      renderLayer(tr.to, s, t, a, LB);
      const R = maxR * easeInCubic(u) + 4;
      mctx.save(); mctx.beginPath(); mctx.arc(f.x, f.y, R, 0, 6.283); mctx.clip(); mctx.drawImage(LB, 0, 0); mctx.restore();
      // brilho na borda da íris (gradiente, sem linha)
      const rg = mctx.createRadialGradient(f.x, f.y, Math.max(0, R - 26), f.x, f.y, R + 10);
      rg.addColorStop(0, 'rgba(143,216,230,0)'); rg.addColorStop(.7, `rgba(200,240,255,${.5 * (1 - u)})`); rg.addColorStop(1, 'rgba(143,216,230,0)');
      mctx.fillStyle = rg; mctx.beginPath(); mctx.arc(f.x, f.y, R + 10, 0, 6.283); mctx.fill();
    } else {
      renderLayer(tr.to, s, t, a, LA); mctx.drawImage(LA, 0, 0);
      renderLayer(tr.from, s, t, a, LB);
      const k = 1 - easeIO(u), R = maxR * .5 * k + 2;
      const cx = lerp(f.x, W / 2, k), cy = lerp(f.y, H / 2, k);
      mctx.save(); mctx.beginPath(); mctx.arc(cx, cy, R, 0, 6.283); mctx.clip();
      mctx.translate(cx, cy); mctx.scale(Math.max(k, .02), Math.max(k, .02)); mctx.drawImage(LB, -W / 2, -H / 2); mctx.restore();
    }
  }
  ctx = mctx; mctx.setTransform(1, 0, 0, 1, 0, 0);
  drawTitle(t);
  drawRewindFX(t);
  finish(t);
}

// ---------- título ----------
function drawTitle(t) {
  const t0 = C.menu + .5; if (t < t0) return;
  pill([{ s: '38 MINUTOS', px: 132, c: COL.white, ls: 10 }, { s: 'POR CAUSA DE UM MENU', px: 44, c: COL.teal, ls: 8, w: 600 }], W / 2, 330, t, t0);
}

// ---------- API ----------
let texturesReady = false;
function drawSafe(t) { if (!texturesReady) { buildTextures(); texturesReady = true; } draw(t); }
window.seek = function (t) { drawSafe(clamp(t, 0, DUR)); return true; };
// desfoque de movimento: 2 subquadros, obturador 0,6
window.renderFrame = function (i) {
  const t = i / FPS, sh = .6 / FPS;
  drawSafe(Math.max(0, t - sh / 4));
  sctx.globalAlpha = 1; sctx.drawImage(cv, 0, 0);
  drawSafe(t + sh / 4);
  mctx.save(); mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.globalAlpha = .5; mctx.drawImage(scratch, 0, 0); mctx.restore();
  return true;
};
window.DBG = (s) => { const a = s, r = earthRot(s, a); return JSON.stringify({ cam: globeCam(s, a), hon: geoWorld(HON[0], HON[1], r), py: geoWorld(PYONG[0], PYONG[1], r), mid: arcMidW(s, a), rot: r / D2R }); };
window.DUR = DUR; window.FPS = FPS; window.RW = [RW0, RW1, RW_BACK];
document.fonts.load('700 40px Fredoka').then(() => document.fonts.load('600 40px Fredoka')).then(() => { window.READY = true; seek(0); });
