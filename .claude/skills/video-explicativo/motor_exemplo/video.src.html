<script>
'use strict';
// =====================================================================
//  38 MINUTOS. Cada frame é função pura do tempo: window.seek(t)
// =====================================================================
const W = 1920, H = 1080, FPS = 30;
const WORDS = __WORDS__;
const DUR = 62.4;

// ---------- utilidades ----------
//@include lib_utils.js

// ---------- palavras e deixas ----------
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
function cue(w, n = 1) {
  let k = 0;
  for (const x of WORDS) if (norm(x.w) === norm(w) && ++k === n) return x.t0;
  throw new Error('cue ' + w + n);
}
const C = {
  havai: cue('havaí'), vibram: cue('vibram'), homem: cue('um'), pega: cue('jim'), carrey: cue('carrey'),
  ameaca: cue('ameaça'), balistico: cue('balístico'), procure: cue('procure'), isto: cue('isto'), simulado: cue('simulação'),
  se: cue('se'), missil: cue('míssil', 2), vinte: cue('vinte'),
  voce: cue('você'), esconder: cue('esconder'), quem: cue('quem'),
  mas: cue('mas'), vazio: cue('vazio'), tres: cue('três'), confirmaram: cue('confirmaram'), lancamento: cue('lançamento'),
  so: cue('só'), correcao: cue('correção'), cinco: cue('cinco'), trinta1: cue('trinta', 1), depois: cue('depois'),
  por: cue('motivo') - .1, tela: cue('tela'), exercicio: cue('exercício'), escolheu: cue('escolheu'), real2: cue('real', 2),
  achou: cue('achou'), verdade: cue('verdade'), teste: cue('teste'), lista: cue('lista'), iguais: cue('iguais'),
  confirmacao: cue('confirmação'), dois2: cue('dois', 2), existia: cue('existia'), pronta: cue('pronta'), desmentir: cue('desmentir'),
  jim2: cue('jim', 2), escreveu: cue('escreveu'), acordou: cue('acordou'), dez: cue('dez'), vida: cue('vida'), trinta2: cue('trinta', 2), mundo: cue('mundo'),
  acabar: cue('acabaria'), menu: cue('menu')
};
C.FA = C.vida - .02;             // chega o "FALSE ALARM" no celular
C.click = C.real2;               // clique no alerta real
window.CUES = C; C.DUR = DUR; C.TITLE = C.menu + .5;   // mix.py lê duração e início do título daqui

// ---------- dois relógios ----------
// ambiente (a = t): brilho das estrelas, giro, flutuação  |  história (s): eventos, volta no rewind
const RW0 = C.trinta2 + .08, RW1 = RW0 + .8, SLOW = .45;
const RW_BACK = C.click - SLOW * (C.menu - RW1);   // o clique repete exatamente em "menu"
function storyT(t) {
  if (t < RW0) return t;
  if (t < RW1) return lerp(RW0, RW_BACK, easeIO((t - RW0) / .8));
  return RW_BACK + SLOW * (t - RW1);
}

// ---------- canvas e camadas ----------
const cv = document.getElementById('c');
const mctx = cv.getContext('2d');
let ctx = mctx;
const mk2d = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const LA = mk2d(), LB = mk2d(), scratch = mk2d(), FX = mk2d();
const sctx = scratch.getContext('2d');
let CAM = { x: 0, y: 0, z: 1 };
const ws = (x, y) => ({ x: W / 2 + (x - CAM.x) * CAM.z, y: H / 2 + (y - CAM.y) * CAM.z });
function applyCam() { ctx.setTransform(CAM.z, 0, 0, CAM.z, W / 2 - CAM.x * CAM.z, H / 2 - CAM.y * CAM.z); }
function screenSpace() { ctx.setTransform(1, 0, 0, 1, 0, 0); }
function mixCam(a, b, u) {
  return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), z: Math.exp(lerp(Math.log(a.z), Math.log(b.z), u)) };
}
// quadros-chave de câmera: [s, x, y, z] em easeInOutCubic, zoom em espaço log
function keyed(keys, s) {
  if (s <= keys[0][0]) return { x: keys[0][1], y: keys[0][2], z: keys[0][3] };
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (s <= b[0]) return mixCam({ x: a[1], y: a[2], z: a[3] }, { x: b[1], y: b[2], z: b[3] }, easeIO((s - a[0]) / (b[0] - a[0])));
  }
  const k = keys[keys.length - 1]; return { x: k[1], y: k[2], z: k[3] };
}
function breathe(c, a, amt = 1) {
  return { x: c.x + amt * 7 * Math.sin(a * .23) / c.z, y: c.y + amt * 5 * Math.sin(a * .31 + 1) / c.z, z: c.z * (1 + amt * .012 * Math.sin(a * .19)) };
}
function shake(c, amp, a) { return { x: c.x + amp * Math.sin(a * 61) / c.z, y: c.y + amp * Math.cos(a * 47) / c.z, z: c.z }; }

// ---------- fundo, texto, grão ----------
//@include lib_bg.js
//@include lib_text.js
//@include lib_finish.js
//@include lib_rewind.js
const COLR = { coral: '#ff8a7a', red: '#ff5f6d', navy: '#0b1e33' };

// =====================================================================
//  TERRA (WebGL, ortográfica, mapa 2048x1024 de polígonos lon/lat)
// =====================================================================
const glc = document.getElementById('gl');
const gl = glc.getContext('webgl', { premultipliedAlpha: true, preserveDrawingBuffer: true, antialias: false });
const VS = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
const FS = `precision highp float;
uniform vec2 ctr; uniform float rot, tilt, crot, rad; uniform vec3 L;
uniform sampler2D day, mk;
const float PI = 3.14159265;
vec4 shade(vec2 frag){
  vec2 q = (frag - ctr) / rad;
  float d = dot(q,q);
  vec3 Ln = normalize(L);
  if (d > 1.) {
    float h = sqrt(d) - 1.;
    float lit = clamp(dot(normalize(vec3(q,0.)), Ln) * .6 + .5, 0., 1.);
    float a = exp(-h * 14.) * (.12 + .62 * lit);
    a *= 1. - smoothstep(.13, .18, h);
    vec3 c = mix(vec3(.30,.50,1.), vec3(.55,.88,1.), lit);
    return vec4(c * a, a);
  }
  vec3 N = vec3(q, sqrt(1. - d));
  float ct = cos(tilt), st = sin(tilt);
  vec3 B = vec3(ct*N.x + st*N.y, -st*N.x + ct*N.y, N.z);
  float lon = atan(B.x, B.z) + rot, lat = asin(clamp(B.y,-1.,1.));
  vec2 uv = vec2(fract(lon / (2.*PI) + .5), .5 - lat / PI);
  float ndl = dot(N, Ln);
  float dayk = smoothstep(-.12, .24, ndl);
  vec3 col = texture2D(day, uv).rgb;
  vec4 m = texture2D(mk, uv);
  float ocean = m.g, city = m.b;
  float cloud = texture2D(mk, vec2(fract(uv.x + crot), uv.y)).r;
  col = mix(col, vec3(1.), cloud * .9);
  vec3 night = vec3(.06,.12,.26) + col * .08;
  vec3 c = mix(night, col * (.75 + .25 * dayk), dayk);
  c += vec3(1.,.82,.45) * city * (1. - dayk) * 1.3;
  c += vec3(1.,.48,.40) * exp(-pow((ndl - .02) / .085, 2.)) * .35;
  vec3 Hh = normalize(Ln + vec3(0.,0.,1.));
  c += vec3(1.) * pow(max(dot(N, Hh), 0.), 45.) * ocean * dayk * .28;
  float rim = pow(1. - N.z, 3.);
  c += vec3(.45,.85,1.) * rim * (.25 + .55 * dayk);
  return vec4(c, 1.);
}
void main(){
  vec4 a = vec4(0.);
  a += shade(gl_FragCoord.xy + vec2(-.25,-.25));
  a += shade(gl_FragCoord.xy + vec2( .25,-.25));
  a += shade(gl_FragCoord.xy + vec2(-.25, .25));
  a += shade(gl_FragCoord.xy + vec2( .25, .25));
  gl_FragColor = a * .25;
}`;
function mkShader(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
const gbuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, gbuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const ploc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(ploc); gl.vertexAttribPointer(ploc, 2, gl.FLOAT, false, 0, 0);
const U = {}; ['ctr', 'rot', 'tilt', 'crot', 'rad', 'L', 'day', 'mk'].forEach(n => U[n] = gl.getUniformLocation(prog, n));

const LAND = {
  na: [[-168, 66], [-160, 71], [-140, 70], [-120, 73], [-95, 72], [-80, 73], [-65, 62], [-55, 52], [-66, 45], [-75, 38], [-81, 30], [-81, 25], [-90, 29], [-97, 26], [-97, 20], [-88, 21], [-87, 15], [-83, 9], [-79, 8], [-85, 12], [-95, 16], [-105, 20], [-112, 30], [-117, 32], [-124, 40], [-124, 48], [-135, 58], [-150, 60], [-165, 60]],
  gl: [[-50, 60], [-42, 60], [-20, 70], [-18, 80], [-35, 83], [-60, 82], [-72, 77], [-55, 70]],
  sa: [[-80, 9], [-72, 12], [-60, 10], [-50, 0], [-35, -5], [-35, -9], [-40, -22], [-48, -26], [-58, -35], [-65, -42], [-68, -52], [-74, -52], [-73, -40], [-71, -30], [-70, -18], [-76, -14], [-81, -5], [-78, 2]],
  eu: [[-10, 36], [-9, 43], [-2, 44], [-5, 48], [3, 51], [8, 54], [10, 57], [5, 62], [15, 69], [28, 71], [42, 68], [40, 60], [30, 55], [40, 46], [28, 41], [22, 36], [15, 38], [12, 44], [8, 44], [3, 42], [-2, 37]],
  af: [[-17, 21], [-10, 30], [-5, 36], [10, 37], [20, 32], [32, 31], [35, 28], [43, 12], [51, 12], [42, -2], [40, -15], [35, -25], [20, -35], [18, -30], [12, -17], [13, -5], [9, 4], [-5, 5], [-13, 8], [-17, 14]],
  as: [[28, 41], [40, 46], [30, 55], [40, 60], [42, 68], [70, 73], [100, 78], [140, 72], [180, 68], [178, 64], [160, 60], [142, 50], [135, 43], [130, 42.5], [128.5, 38.6], [126.5, 37.5], [124.5, 40], [121, 40], [122, 30], [120, 22], [108, 20], [106, 10], [100, 13], [98, 8], [100, 4], [103, 1], [98, 15], [92, 22], [80, 15], [77, 8], [72, 20], [66, 25], [57, 26], [50, 30], [57, 22], [52, 16], [43, 12], [35, 28], [36, 36]],
  ko: [[126.5, 37.5], [128.5, 38.6], [129.5, 36.5], [129.3, 35.2], [127, 34.5], [126.2, 35], [126.6, 36.5]],
  au: [[114, -22], [122, -18], [130, -12], [137, -12], [142, -11], [146, -19], [153, -26], [150, -37], [141, -38], [131, -31], [115, -34]],
  jp: [[130, 31], [135, 34], [140, 36], [142, 41], [141, 45], [139, 40], [133, 35]],
  ph: [[120, 18], [122, 18], [124, 13], [126, 7], [122, 7], [120, 12]],
  bo: [[109, -2], [117, 7], [119, 1], [116, -4]],
  su: [[95, 5], [106, -6], [104, -6], [97, 1]],
  ng: [[131, -1], [150, -6], [147, -10], [138, -8]],
  nz: [[172, -34], [178, -38], [174, -41], [167, -46], [170, -46], [174, -41]],
  an: [[-180, -70], [-120, -73], [-60, -64], [0, -69], [60, -67], [120, -66], [180, -70], [180, -90], [-180, -90]]
};
const BIOME = {
  desert: [[[-15, 16], [35, 16], [35, 30], [-10, 30]], [[38, 16], [55, 18], [57, 28], [40, 30]], [[120, -20], [140, -20], [140, -30], [120, -30]], [[90, 38], [115, 38], [115, 46], [90, 46]], [[-117, 28], [-105, 28], [-105, 38], [-117, 38]]],
  forest: [[[-165, 50], [-55, 50], [-60, 62], [-165, 64]], [[5, 55], [180, 55], [180, 66], [10, 66]]],
  rain: [[[-76, 4], [-48, 4], [-48, -14], [-76, -14]], [[10, 5], [30, 5], [30, -6], [10, -6]], [[95, 12], [150, 12], [150, -10], [95, -10]]],
  ice: [[[-180, 75], [180, 75], [180, 90], [-180, 90]], [[-75, 60], [-15, 60], [-15, 85], [-75, 85]], [[-180, -64], [180, -64], [180, -90], [-180, -90]]]
};
function buildTextures() {
  const TW = 2048, TH = 1024;
  const P = (lon, lat) => [(lon + 180) / 360 * TW, (90 - lat) / 180 * TH];
  const poly = (c, pts) => { c.beginPath(); pts.forEach((q, i) => { const [x, y] = P(q[0], q[1]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.closePath(); c.fill(); };
  const land = document.createElement('canvas'); land.width = TW; land.height = TH;
  const lc = land.getContext('2d'); lc.fillStyle = '#5fc47a';
  Object.values(LAND).forEach(p => poly(lc, p));
  lc.globalCompositeOperation = 'source-atop';
  lc.fillStyle = '#48ad6b'; BIOME.forest.forEach(p => poly(lc, p));
  lc.fillStyle = '#f5c75f'; BIOME.desert.forEach(p => poly(lc, p));
  lc.fillStyle = '#3a9d62'; BIOME.rain.forEach(p => poly(lc, p));
  lc.fillStyle = '#f1f8ff'; BIOME.ice.forEach(p => poly(lc, p));
  const landData = lc.getImageData(0, 0, TW, TH).data;
  const day = document.createElement('canvas'); day.width = TW; day.height = TH;
  const dc = day.getContext('2d');
  const og = dc.createLinearGradient(0, 0, 0, TH);
  og.addColorStop(0, '#1a66b8'); og.addColorStop(.5, '#4dc7eb'); og.addColorStop(1, '#1a66b8');
  dc.fillStyle = og; dc.fillRect(0, 0, TW, TH);
  dc.save(); dc.filter = 'blur(10px)'; dc.globalAlpha = .45; dc.drawImage(land, 0, 0); dc.restore();
  dc.drawImage(land, 0, 0);
  const mk = document.createElement('canvas'); mk.width = TW; mk.height = TH;
  const mc = mk.getContext('2d');
  const md = mc.createImageData(TW, TH);
  for (let i = 0; i < TW * TH; i++) { md.data[i * 4 + 1] = landData[i * 4 + 3] > 10 ? 0 : 255; md.data[i * 4 + 3] = 255; }
  mc.putImageData(md, 0, 0);
  mc.globalCompositeOperation = 'lighter';
  const r = rng(2024); let n = 0, guard = 0;
  while (n < 380 && guard++ < 60000) {
    const lon = r() * 360 - 180, lat = (r() - .5) * 120;
    if (lat > 62 || lat < -45) continue;
    const [x, y] = P(lon, lat);
    const i = (Math.floor(y) * TW + Math.floor(x)) * 4;
    if (landData[i + 3] < 10 || (landData[i] > 230 && landData[i + 1] > 230)) continue;
    const rr = 2 + r() * 4;
    const g = mc.createRadialGradient(x, y, 0, x, y, rr * 2);
    g.addColorStop(0, 'rgba(0,0,255,1)'); g.addColorStop(1, 'rgba(0,0,255,0)');
    mc.fillStyle = g; mc.fillRect(x - rr * 2, y - rr * 2, rr * 4, rr * 4); n++;
  }
  for (let i = 0; i < 34; i++) {
    const lon = r() * 360 - 180, lat = (r() - .5) * 130, [x, y] = P(lon, lat);
    if (Math.abs(lon + 157) < 32 && Math.abs(lat - 20) < 20) continue;   // céu limpo sobre o Havaí
    const w = 30 + r() * 90, h = 12 + r() * 12;
    mc.fillStyle = `rgba(255,0,0,${.6 + r() * .4})`;
    mc.beginPath(); mc.roundRect(x - w / 2, y - h / 2, w, h, h / 2); mc.fill();
    if (r() < .5) { mc.beginPath(); mc.roundRect(x - w / 3 + 20, y + h * .7, w * .6, h * .8, h * .4); mc.fill(); }
  }
  const tex = (img, unit) => {
    const tx = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tx);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  };
  tex(day, 0); tex(mk, 1);
  gl.uniform1i(U.day, 0); gl.uniform1i(U.mk, 1);
}

const ER = 300;                 // raio da Terra no mundo
const TILT = .26;
const D2R = Math.PI / 180;
// giro: 0,55°/s no relógio ambiente + órbita da câmera (história) para enquadrar Coreia e Havaí
const ROT_OFF = -36;
function rotOff(s) { return ROT_OFF * (easeIO((s - (C.se + .2)) / 1.8) - easeIO((s - (C.tres - .2)) / 1.6)); }
const earthRot = (s, a) => (-151.9 - a * .55 + rotOff(s)) * D2R;
// lon/lat -> vetor na vista (x direita, y cima, z para a câmera), mesma matemática do shader
function geoView(lon, lat, rot) {
  const L = lon * D2R - rot, B = lat * D2R;
  const bx = Math.cos(B) * Math.sin(L), by = Math.sin(B), bz = Math.cos(B) * Math.cos(L);
  const ct = Math.cos(TILT), st = Math.sin(TILT);
  return { x: ct * bx - st * by, y: st * bx + ct * by, z: bz };
}
function geoWorld(lon, lat, rot, h = 0) { const v = geoView(lon, lat, rot); return { x: v.x * ER * (1 + h), y: -v.y * ER * (1 + h), vis: v.z, v }; }
const SUBSOLAR = [-129, -21];   // 08:07 no Havaí, janeiro
function drawEarth(rot, a) {
  const p = ws(0, 0), r = ER * CAM.z;
  // caixa da esfera + halo, recortada à tela (o canvas WebGL cobre a tela inteira, nunca achata)
  const R = r * 1.2, x0 = Math.max(0, Math.floor(p.x - R)), x1 = Math.min(W, Math.ceil(p.x + R));
  const y0 = Math.max(0, Math.floor(p.y - R)), y1 = Math.min(H, Math.ceil(p.y + R));
  if (x1 <= x0 || y1 <= y0) return;
  gl.viewport(0, 0, W, H);
  gl.enable(gl.SCISSOR_TEST); gl.scissor(x0, H - y1, x1 - x0, y1 - y0);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  const Lv = geoView(SUBSOLAR[0], SUBSOLAR[1], rot);   // direção da luz recalculada a cada frame
  gl.uniform2f(U.ctr, p.x, H - p.y); gl.uniform1f(U.rad, r);
  gl.uniform1f(U.rot, rot); gl.uniform1f(U.tilt, TILT); gl.uniform1f(U.crot, a * .0012);
  gl.uniform3f(U.L, Lv.x, Lv.y, Lv.z + .15);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  ctx.drawImage(glc, x0, y0, x1 - x0, y1 - y0, x0, y0, x1 - x0, y1 - y0);
}

// ---------- Havaí em vetor ----------
const ISL = {
  hawaii: [[-155.88, 20.26], [-155.82, 19.98], [-155.95, 19.6], [-155.9, 19.1], [-155.66, 18.92], [-155.3, 19.15], [-154.81, 19.5], [-155.08, 19.73], [-155.09, 19.98], [-155.55, 20.13]],

  kahoolawe: [[-156.69, 20.56], [-156.56, 20.6], [-156.53, 20.52], [-156.64, 20.5]],
  lanai: [[-157.0, 20.88], [-156.85, 20.9], [-156.8, 20.79], [-156.93, 20.74], [-157.06, 20.8]],
  molokai: [[-157.31, 21.2], [-157.0, 21.22], [-156.72, 21.17], [-156.71, 21.08], [-157.0, 21.07], [-157.25, 21.09]],
  oahu: [[-158.28, 21.58], [-158.1, 21.71], [-157.96, 21.69], [-157.8, 21.46], [-157.65, 21.32], [-157.71, 21.26], [-157.95, 21.3], [-158.11, 21.3], [-158.24, 21.45]],
  kauai: [[-159.76, 22.14], [-159.55, 22.23], [-159.3, 22.2], [-159.3, 21.96], [-159.45, 21.87], [-159.66, 21.9], [-159.79, 22.02]],
  niihau: [[-160.24, 21.94], [-160.1, 22.02], [-160.05, 21.8], [-160.18, 21.77]]
};
const HON = [-157.86, 21.31], CHAIN = [-157.4, 20.75], PYONG = [125.75, 39.02];
function inPoly(x, y, P) { let c = false; for (let i = 0, j = P.length - 1; i < P.length; j = i++) { const [xi, yi] = P[i], [xj, yj] = P[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
// ~240 celulares espalhados pelas ilhas (Oahu mais densa)
const PHONES = (() => {
  const r = rng(808), out = []; let g = 0;
  while (out.length < 240 && g++ < 40000) {
    const dense = r() < .45;
    const lon = dense ? -158.3 + r() * .7 : -160.3 + r() * 5.6, lat = dense ? 21.25 + r() * .5 : 18.9 + r() * 3.4;
    for (const P of Object.values(ISL)) if (inPoly(lon, lat, P)) { out.push({ lon, lat, ph: r(), j: r() * .12 }); break; }
  }

    const kb = easeOutQuint((s - C.lista + .1) / .5), fade = 1 - easeIO((s - C.confirmacao + .2) / .4);
    if (kb > 0 && fade > 0) {
      ctx.save(); ctx.globalAlpha = fade;
      ctx.fillStyle = COL.gold; const y0 = ROW_Y(REAL), y1 = ROW_Y(TEST);
      ctx.beginPath(); ctx.roundRect(bx - 30, y0 - 4, 30, 8, 4); ctx.roundRect(bx - 30, lerp(y0, y1, kb) - 4, 30, 8, 4); ctx.roundRect(bx - 4, y0 - 4, 8, (y1 - y0) * kb + 8, 4); ctx.fill();
      ctx.restore();
      pill([{ s: 'MESMA LISTA', px: 30, c: COL.gold, ls: 5 }, { s: 'QUASE IGUAIS', px: 30, c: COL.white, ls: 5 }].slice(0, s > C.iguais - .05 ? 2 : 1),
        bx + 210, (ROW_Y(REAL) + ROW_Y(TEST)) / 2, s, C.lista, C.confirmacao - .2, { pad: 18 });
    }
  }
  // cursor e clique
  const cp = cursorPos(s);
  if (s > C.click - 1.3 && s < C.confirmacao) {
    const ck = kick(s - C.click, .45, 16) * .25;
    if (s > C.click) {
      const u = (s - C.click) / .6;
      if (u < 1) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; const R = 20 + 90 * easeOutCubic(u); const rg = ctx.createRadialGradient(cp.x, cp.y, R * .6, cp.x, cp.y, R); rg.addColorStop(0, 'rgba(255,217,138,0)'); rg.addColorStop(.8, `rgba(255,217,138,${.7 * (1 - u)})`); rg.addColorStop(1, 'rgba(255,217,138,0)'); ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(cp.x, cp.y, R, 0, 6.283); ctx.fill(); ctx.restore(); }
    }
    ctx.save(); ctx.translate(cp.x, cp.y); ctx.scale(1.4 * (1 + ck), 1.4 * (1 - ck));
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.moveTo(4, 4); ctx.lineTo(4, 50); ctx.lineTo(16, 38); ctx.lineTo(28, 60); ctx.lineTo(36, 56); ctx.lineTo(24, 34); ctx.lineTo(40, 34); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 46); ctx.lineTo(12, 34); ctx.lineTo(24, 56); ctx.lineTo(32, 52); ctx.lineTo(20, 30); ctx.lineTo(36, 30); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // dois diálogos idênticos
  const dlg = (x, lab, col, t0) => {
    const k = spring(s - t0, .45, 14), out = easeInCubic((s - C.existia) / .5);
    if (k <= 0 || out >= 1) return;
    ctx.save(); ctx.translate(x, lerp(0, -900, out)); ctx.scale(k, k);
    ctx.fillStyle = '#f3f7fb'; ctx.beginPath(); ctx.roundRect(-250, -140, 500, 280, 34); ctx.fill();
    ctx.fillStyle = '#d7e2ec'; ctx.beginPath(); ctx.roundRect(-250, 50, 500, 90, [0, 0, 34, 34]); ctx.fill();
    ctx.fillStyle = '#ff8a7a'; ctx.beginPath(); ctx.roundRect(-210, 68, 190, 56, 28); ctx.fill();
    ctx.fillStyle = '#b8c7d6'; ctx.beginPath(); ctx.roundRect(20, 68, 190, 56, 28); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.translate(x, lerp(0, -900, out)); ctx.scale(k, k);
    riseText('TEM CERTEZA', 0, -40, 48, '#0b1e33', s, t0 + .1, 1e9, { ls: 4 });
    riseText('SIM', -115, 108, 30, '#ffffff', s, t0 + .2, 1e9, { ls: 4 });
    riseText('NÃO', 115, 108, 30, '#0b1e33', s, t0 + .25, 1e9, { ls: 4 });
    ctx.restore();
    pill([{ s: lab, px: 32, c: col, ls: 6 }], x, lerp(-210, -1110, out), s, t0 + .1, C.existia - .1, { pad: 16 });
  };
  dlg(-330, 'TESTE', COL.teal, C.confirmacao - .05);
  dlg(330, 'REAL', COL.coral, C.confirmacao + .15);
  if (s > C.dois2 - .1 && s < C.existia + .3) {
    const k = spring(s - C.dois2, .45, 15), out = 1 - easeIO((s - C.existia) / .3);
    ctx.save(); ctx.translate(0, 0); ctx.scale(k * out, k * out);
    ctx.fillStyle = COL.gold; ctx.beginPath(); ctx.roundRect(-36, -26, 72, 16, 8); ctx.roundRect(-36, 10, 72, 16, 8); ctx.fill();
    ctx.restore();
  }
  // cartão de correção vazio
  if (s > C.existia + .1) {
    const k = spring(s - (C.existia + .2), .5, 13);
    ctx.save(); ctx.translate(0, lerp(500, 0, k));
    ctx.fillStyle = '#f3f7fb'; ctx.beginPath(); ctx.roundRect(-380, -200, 760, 400, 40); ctx.fill();
    ctx.fillStyle = '#d7e2ec'; ctx.beginPath(); ctx.roundRect(-330, -60, 660, 200, 22); ctx.fill();
    if (Math.floor(a * 2.2) % 2 === 0) { ctx.fillStyle = '#1a66b8'; ctx.beginPath(); ctx.roundRect(-306, -36, 6, 50, 3); ctx.fill(); }
    ctx.restore();
    ctx.save(); ctx.translate(0, lerp(500, 0, k));
    riseText('MENSAGEM DE CORREÇÃO', 0, -110, 40, '#0b1e33', s, C.existia + .35, 1e9, { ls: 4 });
    ctx.restore();
    // carimbo "NÃO EXISTIA"
    const ks = spring(s - C.desmentir, .42, 15);
    if (ks > 0) {
      ctx.save(); ctx.translate(40, 60); ctx.rotate(-.12); const sc = lerp(1.8, 1, ks); ctx.scale(sc, sc); ctx.globalAlpha = clamp(ks * 2);
      ctx.fillStyle = '#ff5f6d'; ctx.beginPath(); ctx.roundRect(-250, -56, 500, 112, 30); ctx.fill();
      ctx.restore();
      ctx.save(); ctx.translate(40, 60); ctx.rotate(-.12); ctx.scale(sc, sc);
      riseText('NÃO EXISTIA', 0, 20, 58, '#ffffff', s, C.desmentir + .03, 1e9, { ls: 6 });
      ctx.restore();
    }
  }
}

//@include bed.js
// =====================================================================
//  COMPOSIÇÃO: cenas por tempo da história, transições em íris
// =====================================================================
const SCENES = { globe: drawGlobe, man: drawManScene, screen: drawScreenScene, bath: drawBedScene };
const TRANS = [
  { s: T.t1, from: 'globe', to: 'man', mode: 'open' },
  { s: T.t2, from: 'man', to: 'globe', mode: 'close' },
  { s: T.t3, from: 'globe', to: 'man', mode: 'open' },
  { s: T.t4, from: 'man', to: 'globe', mode: 'close' },
  { s: T.t5, from: 'globe', to: 'screen', mode: 'open' },
  { s: T.t6, from: 'screen', to: 'bath', mode: 'open' }
];
function sceneAt(s) { let n = 'globe'; for (const tr of TRANS) if (s >= tr.s + TD) n = tr.to; return n; }
function renderLayer(name, s, t, a, layer) {
  const c = layer.getContext('2d'); ctx = c; c.setTransform(1, 0, 0, 1, 0, 0);
  SCENES[name](s, t, a); c.setTransform(1, 0, 0, 1, 0, 0); ctx = mctx;
  return layer;
}
function focusOnGlobe(s, a) { const cam = globeCam(s, a); const saved = CAM; CAM = cam; const h = honW(s, a); const p = ws(h.x, h.y); CAM = saved; return p; }
let CUR_T = 0;
function draw(t) {
  CUR_T = t;
  const a = t, s = storyT(t);
  ctx = mctx; mctx.setTransform(1, 0, 0, 1, 0, 0);
  const tr = TRANS.find(q => s >= q.s && s < q.s + TD);
  if (!tr) {
    renderLayer(sceneAt(s), s, t, a, LA); mctx.drawImage(LA, 0, 0);
  } else {
    const u = (s - tr.s) / TD, maxR = Math.hypot(W, H);
    const f = (tr.from === 'globe' || tr.to === 'globe') ? focusOnGlobe(s, a) : { x: W / 2, y: H / 2 };
    if (tr.mode === 'open') {
      renderLayer(tr.from, s, t, a, LA); mctx.drawImage(LA, 0, 0);
      renderLayer(tr.to, s, t, a, LB);
      const R = maxR * easeInCubic(u) + 4;
      mctx.save(); mctx.beginPath(); mctx.arc(f.x, f.y, R, 0, 6.283); mctx.clip(); mctx.drawImage(LB, 0, 0); mctx.restore();
      // brilho na borda da íris (gradiente, sem linha)
      const rg = mctx.createRadialGradient(f.x, f.y, Math.max(0, R - 26), f.x, f.y, R + 10);
      rg.addColorStop(0, 'rgba(143,216,230,0)'); rg.addColorStop(.7, `rgba(200,240,255,${.5 * (1 - u)})`); rg.addColorStop(1, 'rgba(143,216,230,0)');
      mctx.fillStyle = rg; mctx.beginPath(); mctx.arc(f.x, f.y, R + 10, 0, 6.283); mctx.fill();
    } else {
      renderLayer(tr.to, s, t, a, LA); mctx.drawImage(LA, 0, 0);
      renderLayer(tr.from, s, t, a, LB);
      const k = 1 - easeIO(u), R = maxR * .5 * k + 2;
      const cx = lerp(f.x, W / 2, k), cy = lerp(f.y, H / 2, k);
      mctx.save(); mctx.beginPath(); mctx.arc(cx, cy, R, 0, 6.283); mctx.clip();
      mctx.translate(cx, cy); mctx.scale(Math.max(k, .02), Math.max(k, .02)); mctx.drawImage(LB, -W / 2, -H / 2); mctx.restore();
    }
  }
  ctx = mctx; mctx.setTransform(1, 0, 0, 1, 0, 0);
  drawTitle(t);
  drawRewindFX(t);
  finish(t);
}

// ---------- título ----------
function drawTitle(t) {
  const t0 = C.menu + .5; if (t < t0) return;
  pill([{ s: '38 MINUTOS', px: 132, c: COL.white, ls: 10 }, { s: 'POR CAUSA DE UM MENU', px: 44, c: COL.teal, ls: 8, w: 600 }], W / 2, 330, t, t0);
}

// ---------- API ----------
let texturesReady = false;
function drawSafe(t) { if (!texturesReady) { buildTextures(); texturesReady = true; } draw(t); }
window.seek = function (t) { drawSafe(clamp(t, 0, DUR)); return true; };
// desfoque de movimento: 2 subquadros, obturador 0,6
window.renderFrame = function (i) {
  const t = i / FPS, sh = .6 / FPS;
  drawSafe(Math.max(0, t - sh / 4));
  sctx.globalAlpha = 1; sctx.drawImage(cv, 0, 0);
  drawSafe(t + sh / 4);
  mctx.save(); mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.globalAlpha = .5; mctx.drawImage(scratch, 0, 0); mctx.restore();
  return true;
};
window.DUR = DUR; window.FPS = FPS; window.RW = [RW0, RW1, RW_BACK];
document.fonts.load('700 40px Fredoka').then(() => document.fonts.load('600 40px Fredoka')).then(() => { window.READY = true; seek(0); });
